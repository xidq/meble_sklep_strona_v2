<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/text.css">
  <style>
    .checkout-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      font-family: sans-serif;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
    }

    #checkout-form {
      margin: 0;
    }


    h3 {
      margin-top: 25px;
      margin-bottom: 15px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 5px;
      color: #2d3748;
    }
    h3:first-of-type {
      margin-top: 0;
    }

    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-group label {
      width: 140px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
      padding-right: 10px;
      flex-shrink: 0;
    }

    .form-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #4a5568;
    }

    .form-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-grid-2col .form-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .form-grid-2col .form-group label {
      width: auto;
      margin-bottom: 4px;
      padding-right: 0;
    }

    .form-grid-2col .form-group input {
      width: 100%;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin: 20px 0;
      cursor: pointer;
      font-weight: bold;
    }
    .checkbox-group input {
      margin-right: 10px;
    }

    .summary-column {
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .summary-box {
      background-color: #f7fafc;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    #checkout-submit-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    #checkout-submit-btn:hover {
      background-color: #2b6cb0;
    }
    .form-group.has-error input {
      border-color: #e53e3e;
      background-color: #fff5f5;
    }

    .error-message {
      color: #e53e3e;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .form-grid-2col .error-message {
      order: 3;
    }

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .form-grid-2col {
        grid-template-columns: 1fr;
      }
      .summary-column {
        position: static;
        order: -1;
      }
    }
  </style>
</head>
<body>
<div class="checkout-container">

  <!-- LEWA KOLUMNA: DANE KLIENTA -->
  <form id="checkout-form">
    <h3>Dane kontaktowe</h3>

    <div class="form-group">
      <label for="customer-email">Email:</label>
      <input type="email" id="customer-email" placeholder="np. jan.kowalski@gmail.com" required />
    </div>

    <div class="form-group">
      <label for="customer-name">Imię:</label>
      <input type="text" id="customer-name" placeholder="np. Jan" required />
    </div>

    <div class="form-group">
      <label for="customer-surname">Nazwisko:</label>
      <input type="text" id="customer-surname" placeholder="np. Kowalski" required />
    </div>

    <div class="form-group">
      <label for="customer-phone">Telefon:</label>
      <input type="tel" id="customer-phone" placeholder="np. 123456789" required />
    </div>

    <h3>Adres dostawy</h3>

    <div class="form-group">
      <label for="address-street">Ulica i nr:</label>
      <input type="text" id="address-street" placeholder="ul. Wiejska 12 m. 4" required />
    </div>

    <div class="form-group">
      <label for="address-city">Miasto:</label>
      <input type="text" id="address-city" placeholder="np. Warszawa" required />
    </div>

    <div class="form-group">
      <label for="address-zip">Kod pocztowy:</label>
      <input type="text" id="address-zip" placeholder="00-000" required />
    </div>

    <hr>

    <label class="checkbox-group">
      <input type="checkbox" id="wants-invoice" /> Chcę otrzymać fakturę VAT
    </label>

    <!-- SEKCJA FAKTURY (Dwie kolumny) -->
    <div id="invoice-fields-section" style="display: none; margin-top: 15px; padding-left: 15px; border-left: 3px solid #cbd5e0;">
      <h3>Dane do faktury</h3>

      <div class="form-grid-2col">
        <div class="form-group">
          <label for="invoice-company-name">Nazwa firmy:</label>
          <input type="text" id="invoice-company-name" placeholder="Firma X Sp. z o.o." />
        </div>

        <div class="form-group">
          <label for="invoice-nip">NIP:</label>
          <input type="text" id="invoice-nip" placeholder="1234567890" />
        </div>

        <div class="form-group">
          <label for="invoice-street">Ulica i nr (firma):</label>
          <input type="text" id="invoice-street" placeholder="ul. Przemysłowa 5" />
        </div>

        <div class="form-group">
          <label for="invoice-city">Miasto (firma):</label>
          <input type="text" id="invoice-city" placeholder="np. Poznań" />
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="invoice-zip">Kod pocztowy (firma):</label>
          <input type="text" id="invoice-zip" placeholder="00-000" style="max-width: calc(50% - 8px);" />
        </div>
      </div>
    </div>
  </form>

  <!-- PRAWA KOLUMNA PODSUMOWANIE KOSZYKA -->
  <div class="summary-column">
    <div class="summary-box">
      <h3>Podsumowanie zamówienia</h3>
      <div id="cart-summary-list"></div>
      <p style="font-size: 18px; margin-top: 15px; border-top: 1px dashed #cbd5e0; padding-top: 15px;">
        Razem do zapłaty: <strong id="cart-summary-total">0.00 zł</strong>
      </p>
      <button type="button" id="checkout-submit-btn">Przejdź do płatności</button>
    </div>
  </div>

</div>

<script src="../js/auth_ui.js"></script>
<script src="../js/lang.js"></script>
<script src="../js/finalizacja.js"></script>
</body>
</html>
