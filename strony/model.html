<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator 3D Meble (Babylon.js)</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/text.css">
    <style>
        /*body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #fafafa; }*/
        #app-container { display: flex; flex: 1; height: 100%; position: relative; }
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #ffffff 0%, #e5e5e5 100%); }

        #canvas-container canvas { width: 100%; height: 100%; display: block; outline: none; }
        #config-panel { width: 350px; background: #fff; border-left: 1px solid #e0e0e0; padding: 30px 24px; display: flex; flex-direction: column; gap: 24px; box-shadow: -5px 0 15px rgba(0,0,0,0.02); z-index: 10; }
        h2#model-title { margin: 0; font-size: 24px; color: #1a1a1a; font-weight: 600; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 14px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .texture-select { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; cursor: pointer; outline: none; }
        #price-box { font-size: 28px; font-weight: 700; color: #111; margin-top: auto; border-top: 1px solid #eee; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        #price-box span { color: #0056b3; }
        #loading-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; z-index: 100; transition: opacity 0.3s; }
    </style>
</head>
<body>
<script src="../js/auth_ui.js"></script>
<script src="../js/lang.js"></script>

<!-- CDN Babylon.js oraz Loader dla GLTF/GLB -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

<div id="loading-overlay">Ładowanie modelu 3D...</div>

<div id="app-container">
    <div id="canvas-container">
        <canvas id="renderCanvas"></canvas>
    </div>

    <div id="config-panel">
        <h2 id="model-title">Wczytywanie...</h2>
        <div class="control-group">
            <div id="dynamic-slots"></div>
        </div>
        <div id="price-box">
            <span>Cena:</span>
            <div><span id="price-value">0</span> zł</div>
        </div>
    </div>
</div>

<script src="../js/configurator.js"></script>
</body>
</html>
