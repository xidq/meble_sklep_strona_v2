<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrzynka Email</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/text.css">
    <style>
        .email-app { display: grid; grid-template-columns: 200px 1fr 1fr; gap: 20px; height: 80vh; }
        .sidebar { display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #ccc; }
        .email-item { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .email-item.unread { background-color: #e8f0fe; font-weight: bold; border-left: 4px solid #4285f4; }
        .email-preview { border-left: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
<div class="email-app">
    <div id="composeModal" style="display:none; position:fixed; top:20%; left:30%; background:white; padding:20px; border:1px solid #ccc; z-index:100;">
        <h3>Nowa wiadomość</h3>
        <input type="text" id="composeTo" placeholder="Do (użytkownik)" style="width:100%; margin-bottom:10px;"><br>
        <input type="text" id="composeSubject" placeholder="Temat" style="width:100%; margin-bottom:10px;"><br>
        <textarea id="composeContent" placeholder="Treść" style="width:100%; height:100px;"></textarea><br>
        <button onclick="sendNewEmail()">Wyślij</button>
        <button onclick="closeCompose()">Anuluj</button>
    </div>
    <aside class="sidebar">
        <button onclick="changeFolder('inbox')">Odbiorcze</button>
        <button onclick="changeFolder('sent')">Wysłane</button>
        <button onclick="changeFolder('outbox')">Skrzynka nadawcza (kolejka)</button> <!-- DODANE -->
        <button onclick="changeFolder('spam')">Spam</button>
        <button onclick="openCompose()">+ Napisz</button>
    </aside>
    <main class="main-view">
        <input type="text" id="emailFilter" placeholder="Filtruj...">
        <div id="emailList" class="email-list"></div>
    </main>
    <section id="emailPreview" class="email-preview">
        <h3>Treść wiadomości</h3>
        <div id="previewContent">Wybierz wiadomość</div>
    </section>
</div>
<script src="../js/lang.js"></script>
<script src="../js/auth_ui.js"></script>
<script src="../js/email.js"></script>
</body>
</html>
