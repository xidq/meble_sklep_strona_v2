<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Katalog produktów w naszym sklepie. Przeglądaj unikalne meble i dekoracje z opcją konfiguracji 3D.">
    <title data-i18n="nav_products">Title</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/gallery.css">
    <link rel="stylesheet" href="/css/text.css">
    <script src="/js/auth_ui.js" defer></script>
    <script src="/js/lang.js" defer></script>
</head>
<body>
<main class="gallery-container" id="MAIN">
    <div class="gallery-grid" id="galleryGrid">
    </div>
</main>

<script>
    const grid = document.getElementById('galleryGrid');

    async function loadGallery() {
        try {
            // 1. Równoległe pobranie lekkich metadanych (router i produkty) raz na start
            const [routerResponse, apiProductsResponse] = await Promise.all([
                fetch('/data/router.json'),
                fetch('/api/products')
            ]);

            if (!routerResponse.ok) throw new Error('Błąd routera: ' + routerResponse.statusText);
            if (!apiProductsResponse.ok) throw new Error('Błąd API produktów: ' + apiProductsResponse.statusText);

            const [routerData, apiProductsData] = await Promise.all([
                routerResponse.json(),
                apiProductsResponse.json()
            ]);

            const productsMap = new Map(apiProductsData.map(prod => [prod.name_id, prod]));
            const currentLang = localStorage.getItem('user-lang') || 'pl';

            // 2. Tworzenie lekkich "szkieletów" dla wszystkich elementów (żeby layout/scroll działał od razu)
            const fragment = document.createDocumentFragment();
            const observerTargets = [];

            routerData.forEach((item) => {
                const apiProduct = productsMap.get(item.id);
                if (!apiProduct || !item.img) return;

                const itemAnchor = document.createElement('a');
                itemAnchor.href = `item.html?id=${item.id}`;
                itemAnchor.className = 'gallery-item glow';

                const initialName = currentLang === 'en' ? apiProduct.name_en : apiProduct.name_pl;


                // Dodano aria-label, aby link miał unikalną i czytelną nazwę dla czytników ekranu (rozwiązuje błąd "Links do not have a discernible name")
                itemAnchor.setAttribute('aria-label', initialName);
                // Wstępny szkielet z miejscem na grafikę
                itemAnchor.innerHTML = `
                    <div class="img-placeholder" style="width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; color: #aaa; background: rgba(0,0,0,0.03);">Ładowanie...</div>
                    <div class="overlay product-title" data-name-pl="${apiProduct.name_pl}" data-name-en="${apiProduct.name_en}">${initialName}</div>
                `;

                fragment.appendChild(itemAnchor);

                // Zapisujemy powiązanie elementu DOM z jego danymi do dociągnięcia
                observerTargets.push({ element: itemAnchor, item, apiProduct });
            });

            grid.appendChild(fragment);

            if (typeof setLanguage === 'function') {
                setLanguage(currentLang);
            }

            // 3. Intersection Observer - dociąga JSON ze zdjęciami dopiero, gdy element wchodzi w pole widzenia
            const observerOptions = {
                root: null,          // viewport przeglądarki
                rootMargin: '300px', // ładuje z wyprzedzeniem 300px zanim element pojawi się na ekranie
                threshold: 0.01
            };

            const observer = new IntersectionObserver(async (entries, observerInstance) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        const targetCard = entry.target;
                        observerInstance.unobserve(targetCard); // Przestajemy obserwować po jednorazowym załadowaniu

                        // Znajdujemy odpowiedni obiekt danych dla tego kafelka
                        const targetData = observerTargets.find(t => t.element === targetCard);
                        if (!targetData) continue;

                        const { item, apiProduct } = targetData;

                        try {
                            // Pobieramy plik ze zdjęciami dopiero teraz
                            const resImg = await fetch('/' + item.img);
                            if (!resImg.ok) continue;
                            const imgData = await resImg.json();



                            const p256 = imgData.var_1 && imgData.var_1["256"] ? imgData.var_1["256"] : '';
                            const p512 = imgData.var_1 && imgData.var_1["512"] ? imgData.var_1["512"] : p256;
                            const currentLangNow = localStorage.getItem('user-lang') || 'pl';
                            const initialName = currentLangNow === 'en' ? apiProduct.name_en : apiProduct.name_pl;

                            // Podmieniamy zawartość szkieletu na gotowy obrazek
                            targetCard.innerHTML = `
                                <img
                                    src="${p256}"
                                    srcset="${p256} 256w, ${p512} 512w"
                                    sizes="(min-width: 2000px) 512px, 256px"
                                    alt="${initialName}"
                                    loading="lazy"
                                    decoding="async"
                                >
                                <div class="overlay product-title" data-name-pl="${apiProduct.name_pl}" data-name-en="${apiProduct.name_en}">${initialName}</div>
                            `;
                        } catch (err) {
                            console.error(`Błąd dociągania obrazka dla ${item.id}:`, err);
                            const placeholder = targetCard.querySelector('.img-placeholder');
                            if (placeholder) placeholder.textContent = 'Błąd ładowania';
                        }
                    }
                }
            }, observerOptions);

            // Rejestrujemy wszystkie karty w observerze
            observerTargets.forEach(target => {
                observer.observe(target.element);
            });

        } catch (error) {
            console.error('Błąd podczas ładowania galerii:', error);
            grid.innerHTML = `<p style="color: red; padding: 20px;">Błąd ładowania galerii. Spróbuj odświeżyć stronę.</p>`;
        }
    }

    loadGallery();
</script>
<!--</script>-->
<script>
    window.addEventListener("wheel", function (e) {
        const isLandscape = window.matchMedia("(orientation: landscape)").matches;

        if (!isLandscape) {
            return;
        }

        e.preventDefault();

        const scrollAmount = e.deltaY;

        window.scrollBy({
            left: scrollAmount,
            behavior: 'auto' // 'auto' zamiast 'smooth' żeby nie szarpało
        });
    }, { passive: false });
</script>
