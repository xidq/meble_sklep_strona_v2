<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_products">Title</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/gallery.css">
    <link rel="stylesheet" href="/css/text.css">
</head>
<body>
<div class="gallery-container" id="MAIN">
    <div class="gallery-grid" id="galleryGrid">
    </div>
</div>

<script>
    const grid = document.getElementById('galleryGrid');

    // Funkcja renderująca pojedynczy element
    function renderItem(id, apiProduct, imgData) {
        const itemAnchor = document.createElement('a');
        itemAnchor.href = `item.html?id=${id}`;
        itemAnchor.className = 'gallery-item glow';

        // Wyciągamy rozdzielczości dla wariantu pierwszego (var_1)
        const p256 = imgData.var_1["256"];
        const p512 = imgData.var_1["512"];

        // Początkowa nazwa (dla atrybutu alt i szybkiego renderu)
        const currentLang = localStorage.getItem('user-lang') || 'pl';
        const initialName = currentLang === 'en' ? apiProduct.name_en : apiProduct.name_pl;

        // Dodajemy klasę 'product-title' oraz atrybuty data-name-*
        itemAnchor.innerHTML = `
            <img
                src="${p256}"
                srcset="${p256} 256w, ${p512} 512w"
                sizes="(min-width: 2000px) 512px, 256px"
                alt="${initialName}"
                loading="lazy"
            >
            <div class="overlay product-title" data-name-pl="${apiProduct.name_pl}" data-name-en="${apiProduct.name_en}">${initialName}</div>
        `;

        grid.appendChild(itemAnchor);
    }

    // Główna funkcja ładowania galerii
    async function loadGallery() {
        try {
            const [routerResponse, apiProductsResponse] = await Promise.all([
                fetch('/data/router.json'),
                fetch('/api/products')
            ]);

            if (!routerResponse.ok) throw new Error('Błąd routera: ' + routerResponse.statusText);
            if (!apiProductsResponse.ok) throw new Error('Błąd API produktów: ' + apiProductsResponse.statusText);

            const routerData = await routerResponse.json();
            const apiProductsData = await apiProductsResponse.json();

            const productsMap = new Map();
            apiProductsData.forEach(prod => {
                productsMap.set(prod.name_id, prod);
            });

            const promises = routerData.map(async (item) => {
                try {
                    const apiProduct = productsMap.get(item.id);

                    if (!apiProduct) {
                        console.warn(`Brak danych bazodanowych dla elementu z routera: ${item.id}`);
                        return;
                    }

                    if (!item.img) {
                        console.warn(`Brak pliku zdjęć dla: ${item.id}`);
                        return;
                    }

                    const resImg = await fetch('/' + item.img);
                    if (!resImg.ok) {
                        throw new Error(`Nie udało się pobrać pliku zdjęć dla ${item.id}`);
                    }

                    const imgData = await resImg.json();

                    // Przekazujemy CAŁY obiekt apiProduct zamiast jednego stringa
                    renderItem(item.id, apiProduct, imgData);
                } catch (itemError) {
                    console.error(`Błąd ładowania elementu ${item.id}:`, itemError);
                }
            });

            // Czekamy na wygenerowanie HTML dla wszystkich kart
            await Promise.all(promises);

            // Wymuszamy aktualizację języków dla nowo wyrenderowanych elementów galerii
            const savedLang = localStorage.getItem('user-lang') || 'pl';
            if (typeof setLanguage === 'function') {
                setLanguage(savedLang);
            }

        } catch (error) {
            console.error('Błąd podczas ładowania galerii:', error);
            grid.innerHTML = `<p style="color: red; padding: 20px;">Błąd ładowania galerii. Spróbuj odświeżyć stronę.</p>`;
        }
    }

    // Odpalamy ładowanie
    loadGallery();
</script>
<script>
    window.addEventListener("wheel", function (e) {
        // Sprawdzamy czy ekran jest w orientacji poziomej (landscape)
        const isLandscape = window.matchMedia("(orientation: landscape)").matches;

        if (!isLandscape) {
            // Jeśli to pionowy ekran (portrait), pozwól na standardowy scroll
            return;
        }

        // Blokujemy domyślny ruch tylko w poziomie
        e.preventDefault();

        // Używamy mniejszego mnożnika lub bezpośredniej wartości deltaY, żeby nie skakało za szybko
        const scrollAmount = e.deltaY;

        window.scrollBy({
            left: scrollAmount,
            behavior: 'auto' // 'auto' zamiast 'smooth' likwiduje szarpanie przy szybkim kręceniu
        });
    }, { passive: false });
</script>
<script>
    // window.addEventListener("scroll", function () {
    //     if (window.scrollX !== 0) {
    //         console.log("Globalny scroll poziomy:", window.scrollX);
    //     }

    var item = document.getElementById("MAIN");

    item.addEventListener("scroll", function (e) {
        // Sprawdzamy czy zdarzenie dotyczy bezpośrednio naszego elementu lub jego wnętrza
        console.log("Przesuwanie konkretnego elementu:", item.scrollLeft);
    }, { capture: true });
</script>
</body>
<script src="/js/auth_ui.js"></script>
<script src="/js/lang.js"></script>
</html>
